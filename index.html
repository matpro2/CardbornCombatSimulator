<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simulateur de Combat</title>
</head>
<body>

    <h1>Simulateur de Combat Tour par Tour</h1>

    <div id="loadingMessage">
        <p><strong>Chargement des cartes...</strong></p>
    </div>

    <div id="app" hidden>
        <fieldset>
            <legend>Équipe 1 (Bleue)</legend>
            <div id="team1Selectors"></div>
        </fieldset>

        <br>

        <fieldset>
            <legend>Équipe 2 (Rouge)</legend>
            <div id="team2Selectors"></div>
        </fieldset>

        <br>

        <fieldset>
            <legend>Générateur Aléatoire Équilibré</legend>
            <p>
                <label>Mode d'équilibrage :
                    <select id="randomTierMode">
                        <option value="balanced">Normalisé (Tiers ajustés pour un combat équitable)</option>
                        <option value="bracket">Même tranche de RNG de base</option>
                        <option value="raw">Aléatoire total (Sans ajustement)</option>
                    </select>
                </label>
                &nbsp;|&nbsp;
                <label>Cartes par équipe :
                    <select id="randomTeamSize">
                        <option value="auto">Aléatoire (1 à 4)</option>
                        <option value="1">1 vs 1</option>
                        <option value="2">2 vs 2</option>
                        <option value="3">3 vs 3</option>
                        <option value="4" selected>4 vs 4</option>
                    </select>
                </label>
                &nbsp;
                <button type="button" id="btnRandomizeTeams">Générer les équipes</button>
            </p>
        </fieldset>

        <p>
            <button type="button" id="btnStartBattle">Lancer le combat complet</button>
            <button type="button" id="btnNextTurn" disabled>Tour suivant</button>
            <button type="button" id="btnResetBattle">Réinitialiser</button>
        </p>

        <fieldset>
            <legend>État du Terrain</legend>
            <div id="boardState">
                <p><em>En attente du lancement...</em></p>
            </div>
        </fieldset>

        <br>

        <fieldset>
            <legend>Journal de Combat (Logs)</legend>
            <div id="battleLogsContainer" style="height: 260px; overflow-y: auto; background: #1a1a1a; padding: 10px; border: 1px solid #444; font-family: monospace; font-size: 13px;">
                <ul id="battleLogs" style="list-style-type: none; margin: 0; padding: 0;"></ul>
            </div>
        </fieldset>
    </div>

    <script src="battle-engine.js"></script>
    <script src="battle-ui.js"></script>
</body>
</html>
